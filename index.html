<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Beat Maker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <b>🎧 Ultimate Beat Maker</b>

  <button id="play">▶</button>
  <button id="stop">■</button>
  <button id="export">⬇ WAV</button>
  <button id="save">💾</button>
  <button id="load">📂</button>

  BPM <input id="bpm" type="range" min="60" max="180" value="120">
  <span id="bpmVal">120</span>
</div>

<div class="layout">

  <!-- LEFT TRACKS -->
  <div class="tracks" id="trackNames"></div>

  <!-- TIMELINE -->
  <div class="timeline" id="timeline"></div>

</div>

<div class="bottom">

  <div>
    <h3>Channel Rack</h3>
    <div id="sequencer"></div>
  </div>

  <div>
    <h3>Piano Roll</h3>
    <div id="piano"></div>
  </div>

  <div>
    <h3>Mixer</h3>
    <div id="mixer"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
