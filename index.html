<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DAW PRO v16 STABLE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <button onclick="DAW.play()">▶ Play</button>
  <button onclick="DAW.stop()">■ Stop</button>
  <button onclick="DAW.toggleRecord()">⏺ Record</button>
  <button onclick="exportProject()">💾 Export</button>
  <input type="file" id="importFile">
</div>

<div id="app">

  <!-- SIDEBAR (UNCHANGED IDEA, ONLY STABILIZED) -->
  <div id="sidebar">
    <h3>Instruments</h3>
    <button onclick="addTrack('sine')">🎹 Synth</button>
    <button onclick="addTrack('square')">📟 Square</button>
    <button onclick="addTrack('triangle')">🔺 Triangle</button>
    <button onclick="addTrack('sawtooth')">🌊 Saw</button>
    <button onclick="addTrack('bass')">🎸 Bass</button>
    <button onclick="addTrack('drums')">🥁 Drums</button>
  </div>

  <!-- TIMELINE -->
  <div id="timelineWrap">
    <div id="timeline"></div>
  </div>

</div>

<!-- PIANO ROLL -->
<h3>Piano Roll</h3>

<div id="pianoScroll">
  <div id="piano"></div>
</div>

<script src="engine.js"></script>
<script src="main.js"></script>

</body>
</html>
