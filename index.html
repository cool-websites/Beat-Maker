<!DOCTYPE html>
<html>
<head>
  <title>DAW PRO v7</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <button onclick="DAW.play()">▶ Play</button>
  <button onclick="DAW.stop()">■ Stop</button>
  <button onclick="DAW.addTrack()">+ Track</button>
  <button onclick="DAW.save()">💾 Save</button>
  <button onclick="DAW.load()">📂 Load</button>
</div>

<!-- 🎛 INSTRUMENT PANEL -->
<div id="instrumentPanel">
  <button onclick="setInstrument('sine')">🎹 Synth</button>
  <button onclick="setInstrument('square')">📟 Square</button>
  <button onclick="setInstrument('triangle')">🔺 Soft</button>
  <button onclick="setInstrument('drums')">🥁 Drums</button>
</div>

<!-- WORKSPACE -->
<div id="workspace">

  <div id="timelineWrap">
    <div id="playhead"></div>
    <div id="timeline"></div>
  </div>

  <div id="mixer"></div>

</div>

<h3>Piano Roll</h3>
<div id="piano"></div>

<script src="engine.js"></script>
<script src="main.js"></script>

</body>
</html>
