<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DAW PRO v21 GRID LIGHTUP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <button onclick="DAW.play()">▶ Play</button>
  <button onclick="DAW.stop()">■ Stop</button>
  <button onclick="DAW.exportWAV()">🎧 Export WAV</button>
</div>

<h3>Piano Grid</h3>
<div id="pianoScroll">
  <div id="piano"></div>
</div>

<h3>Tracks</h3>
<div id="timelineWrap">
  <div id="timeline"></div>
</div>

<h3>Instrument Selector</h3>
<div id="gridButtons">
  <button onclick="setGrid('sine')">🎹 Piano</button>
  <button onclick="setGrid('triangle')">🔺 Triangle</button>
  <button onclick="setGrid('square')">📟 Square</button>
  <button onclick="setGrid('sawtooth')">🌊 Saw</button>
  <button onclick="setGrid('bass')">🎸 Bass</button>
  <button onclick="setGrid('drums')">🥁 Drums</button>
</div>

<div id="instrumentWrap">
  <div id="instrumentGrid"></div>
</div>

<script src="engine.js"></script>
<script src="main.js"></script>

</body>
</html>
