<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web DAW X</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">🎧 Web DAW X</div>

  <button id="play">▶</button>
  <button id="stop">■</button>
  <button id="export">⬇ WAV</button>

  <div class="bpm">
    BPM <input id="bpm" type="range" min="60" max="180" value="120">
    <span id="bpmVal">120</span>
  </div>
</div>

<!-- MAIN GRID (BandLab-style horizontal tracks) -->
<div class="arrangement">

  <!-- TRACK LIST -->
  <div class="track-list">
    <div>Kick</div>
    <div>Snare</div>
    <div>HiHat</div>
    <div>Clap</div>
    <div>Bass</div>
  </div>

  <!-- TIMELINE -->
  <div id="timeline"></div>

</div>

<!-- BOTTOM PANELS -->
<div class="bottom">

  <div class="panel">
    <h3>🎛 Channel Rack</h3>
    <div id="sequencer"></div>
  </div>

  <div class="panel">
    <h3>🎹 Piano Roll (Bass)</h3>
    <div id="piano"></div>
  </div>

  <div class="panel">
    <h3>🎚 Mixer</h3>
    <div id="mixer"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
