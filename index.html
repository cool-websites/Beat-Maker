<!DOCTYPE html>
<html>
<head>
  <title>DAW PRO v11</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <button onclick="DAW.play()">▶ Play</button>
  <button onclick="DAW.stop()">■ Stop</button>
  <button onclick="DAW.toggleRecord()">⏺ Record</button>
  <button onclick="exportProject()">💾 Export</button>
  <input type="file" id="importFile">
</div>

<div id="app">

  <!-- 🎛 INSTRUMENT SIDEBAR -->
  <div id="sidebar">
    <h3>Instruments</h3>
    <button onclick="addInstrument('sine')">🎹 Synth</button>
    <button onclick="addInstrument('square')">📟 Square</button>
    <button onclick="addInstrument('triangle')">🔺 Soft</button>
    <button onclick="addInstrument('sawtooth')">🌊 Saw</button>
    <button onclick="addInstrument('piano')">🎼 Piano</button>
    <button onclick="addInstrument('bass')">🎸 Bass</button>
    <button onclick="addInstrument('drums')">🥁 Drums</button>
  </div>

  <!-- 🎧 VERTICAL TRACK VIEW (THIS IS THE KEY CHANGE) -->
  <div id="trackContainer">
    <div id="timeline"></div>
  </div>

</div>

<!-- 🎹 PIANO ROLL -->
<h3>Piano Roll (scroll to edit tracks)</h3>
<div id="pianoScroll">
  <div id="piano"></div>
</div>

<script src="engine.js"></script>
<script src="main.js"></script>

</body>
</html>
