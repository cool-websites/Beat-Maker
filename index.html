<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DAW PRO v19</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <button onclick="DAW.play()">▶ Play</button>
  <button onclick="DAW.stop()">■ Stop</button>
  <button onclick="DAW.exportWAV()">🎧 Export WAV</button>
  <button onclick="exportProject()">💾 Export Project</button>
  <input type="file" id="importFile">
</div>

<!-- 🎹 PIANO (TOP) -->
<h3>Piano Roll</h3>
<div id="pianoScroll">
  <div id="piano"></div>
</div>

<!-- 📜 TRACKS (MIDDLE) -->
<h3>Tracks</h3>
<div id="timelineWrap">
  <div id="timeline"></div>
</div>

<!-- 🎛 INSTRUMENTS (BOTTOM) -->
<h3>Instruments</h3>
<div id="instrumentRack">
  <button onclick="addTrack('sine')">🎹 Synth</button>
  <button onclick="addTrack('square')">📟 Square</button>
  <button onclick="addTrack('triangle')">🔺 Triangle</button>
  <button onclick="addTrack('sawtooth')">🌊 Saw</button>
  <button onclick="addTrack('bass')">🎸 Bass</button>
  <button onclick="addTrack('drums')">🥁 Drums</button>
</div>

<script src="engine.js"></script>
<script src="main.js"></script>

</body>
</html>
