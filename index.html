<!DOCTYPE html>
<html>
<head>
  <title>Web DAW Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">🎧 Web DAW</div>

  <div class="controls">
    <button id="play">▶</button>
    <button id="stop">■</button>
    <button id="export">⬇ WAV</button>
    <button id="save">💾 Save</button>
    <button id="load">📂 Load</button>
    <input type="file" id="fileInput" hidden>
  </div>

  <div>
    BPM <input id="bpm" type="range" min="60" max="180" value="120">
    <span id="bpmVal">120</span>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="tracks" id="trackNames"></div>

  <div class="timeline-container">
    <div id="timeline"></div>
  </div>

  <div class="mixer" id="mixer"></div>

</div>

<!-- BOTTOM -->
<div class="bottom">

  <div class="tabs">
    <button onclick="showTab('rack')">Channel Rack</button>
    <button onclick="showTab('piano')">Piano Roll</button>
  </div>

  <div id="rack" class="tab active">
    <div id="sequencer"></div>
  </div>

  <div id="pianoTab" class="tab">
    <div id="piano"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
